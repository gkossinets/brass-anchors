<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brass Anchors: end of game (Broadcast brass)</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0E1726}
a{color:#E3C25A}a:hover{color:#F2D77E}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; background: #0E1726; color: #F2EBDD; font-family: 'Source Sans 3', sans-serif; padding: 0 24px 64px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #2A3A56; flex-wrap: wrap; gap: 12px">
<span style="font-family: Oswald, sans-serif; font-weight: 600; letter-spacing: 0.12em; font-size: 15px">BRASS ANCHORS</span>
<div style="display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A9B3C4">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #5E6E8A"></span>
<span>OFF AIR</span>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 40px">
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #C9A227">AND THAT'S THE WAY IT WAS</p>
<h1 style="margin: 0; font-family: Oswald, sans-serif; font-weight: 700; font-size: 120px; line-height: 0.9">7<span style="font-size: 56px; color: #A9B3C4"> / 9</span></h1>
<p style="margin: 0; font-size: 19px; color: #C9D1DE">Match the description · 5 rounds</p>
</div>

<table style="flex: 1 1 420px; border-collapse: collapse; font-size: 17px; align-self: flex-start">
<thead>
<tr><th colspan="2" style="text-align: left; padding: 0 0 10px; font-family: 'IBM Plex Mono', monospace; font-weight: 400; font-size: 13px; letter-spacing: 0.08em; color: #A9B3C4">ACCURACY</th></tr>
</thead>
<tbody>
<tr style="border-top: 1px solid #2A3A56"><td style="padding: 12px 0">Easy (×1)</td><td style="padding: 12px 0; text-align: right; font-family: 'IBM Plex Mono', monospace">2 / 2</td></tr>
<tr style="border-top: 1px solid #2A3A56"><td style="padding: 12px 0">Medium (×2)</td><td style="padding: 12px 0; text-align: right; font-family: 'IBM Plex Mono', monospace">1 / 2</td></tr>
<tr style="border-top: 1px solid #2A3A56"><td style="padding: 12px 0">Hard (×3)</td><td style="padding: 12px 0; text-align: right; font-family: 'IBM Plex Mono', monospace">1 / 1</td></tr>
<tr><th colspan="2" style="text-align: left; padding: 22px 0 10px; font-family: 'IBM Plex Mono', monospace; font-weight: 400; font-size: 13px; letter-spacing: 0.08em; color: #A9B3C4">HARD ROUNDS</th></tr>
<tr style="border-top: 1px solid #2A3A56; border-bottom: 1px solid #2A3A56"><td style="padding: 12px 0">When only the decade differed</td><td style="padding: 12px 0; text-align: right; font-family: 'IBM Plex Mono', monospace">1 / 1</td></tr>
</tbody>
</table>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; background: #16233A; border-radius: 4px; padding: 24px">
<label for="cues-a" style="font-family: Oswald, sans-serif; font-weight: 600; font-size: 24px; text-transform: uppercase">What gave it away?</label>
<textarea id="cues-a" rows="5" placeholder="Pauses, pitch resets, speed, emphasis, the shape of sentence endings..." style="background: #0A111D; color: #F2EBDD; border: 1px solid #3A4C6B; border-radius: 3px; padding: 14px; font-family: 'Source Sans 3', sans-serif; font-size: 17px; line-height: 1.5; resize: vertical"></textarea>
<div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center">
<button type="button" style="min-height: 48px; padding: 0 28px; border: 0; border-radius: 3px; background: #C9A227; color: #0E1726; font-family: Oswald, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 0.06em; cursor: pointer">SAVE</button>
<button type="button" style="min-height: 48px; padding: 0 20px; border: 2px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 17px; letter-spacing: 0.06em; cursor: pointer">EXPORT ALL SAVED GAMES (JSON)</button>
<button type="button" style="min-height: 48px; padding: 0 20px; border: 2px solid #C9A227; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 17px; letter-spacing: 0.06em; cursor: pointer">NEW GAME</button>
<span style="font-size: 15px; color: #A9B3C4">Saved. [N] games stored in this browser.</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brass":{"editor":"color","default":"#C9A227","options":["#C9A227","#D98E3A","#B9C4D6"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { brass: this.props.brass ?? '#C9A227' };
}
}
</script>
</body>
</html>
