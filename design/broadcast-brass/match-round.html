<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brass Anchors: match round (Broadcast brass)</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>

</style>
</helmet>
<div style="width: 100%; min-height: 900px; box-sizing: border-box; background: #0E1726; color: #F2EBDD; font-family: 'Source Sans 3', sans-serif; padding: 0 24px 64px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #2A3A56; flex-wrap: wrap; gap: 12px">

<div style="display: flex; gap: 6px" aria-label="Round 3 of 5">
<span style="width: 40px; height: 6px; background: #C9A227"></span>
<span style="width: 40px; height: 6px; background: #C9A227"></span>
<span style="width: 40px; height: 6px; background: #F2EBDD"></span>
<span style="width: 40px; height: 6px; background: #2A3A56"></span>
<span style="width: 40px; height: 6px; background: #2A3A56"></span>
</div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A9B3C4">SCORE 2 / 2</span>
</div>

<div style="display: flex; flex-direction: column; gap: 0">
<p style="margin: 0 0 12px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #A9B3C4">ROUND 3 OF 5 · MEDIUM</p>
<div style="display: flex; flex-wrap: wrap; align-items: stretch">
<span style="background: #C9A227; color: #0E1726; padding: 14px 20px; font-family: Oswald, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.1em; display: flex; align-items: center">FIND</span>
<h1 style="margin: 0; background: #F2EBDD; color: #0E1726; padding: 12px 24px; font-family: Oswald, sans-serif; font-weight: 600; font-size: 40px; text-transform: uppercase; flex: 1 1 400px">A UK news report from the 1970s</h1>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 420px; background: #16233A; border-radius: 4px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: Oswald, sans-serif; font-weight: 600; font-size: 28px">CLIP A</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A9B3C4">PLAYED · 0:14</span>
</div>
<div style="background: #0A111D; border-radius: 3px; padding: 12px">
<svg viewBox="0 0 600 140" width="100%" height="140" role="img" aria-label="Spectrogram of clip A">
<g stroke="#22314A" stroke-width="1"><path d="M0 35H600M0 70H600M0 105H600"></path></g>
<g fill="none" stroke="#C9A227" stroke-linecap="round" opacity="0.35" stroke-width="3" transform="translate(0,-42)"><path d="M8 96 C28 74 44 66 62 76 S96 100 116 84 S150 58 172 88 M204 72 C222 52 250 56 270 78 S306 104 330 94 M362 62 C384 44 412 52 432 72 S470 108 512 112 M540 80 C556 70 572 74 592 92"></path></g>
<g fill="none" stroke="#C9A227" stroke-linecap="round" stroke-width="5"><path d="M8 96 C28 74 44 66 62 76 S96 100 116 84 S150 58 172 88 M204 72 C222 52 250 56 270 78 S306 104 330 94 M362 62 C384 44 412 52 432 72 S470 108 512 112 M540 80 C556 70 572 74 592 92"></path></g>
</svg>
</div>
<div style="height: 4px; background: #2A3A56"><div style="width: 100%; height: 4px; background: #5E6E8A"></div></div>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<button type="button" aria-label="Replay clip A" style="min-height: 48px; padding: 0 20px; border: 2px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 17px; letter-spacing: 0.06em; display: flex; align-items: center; gap: 10px; cursor: pointer"><svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M1 1l12 7-12 7z" fill="#F2EBDD"></path></svg>REPLAY</button>
<button type="button" style="flex-grow: 1; min-height: 48px; padding: 0 20px; border: 2px solid #C9A227; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 17px; letter-spacing: 0.06em; cursor: pointer">THIS ONE</button>
</div>
</div>

<div style="flex: 1 1 420px; background: #16233A; border-radius: 4px; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-shadow: inset 0 0 0 2px #C9A227">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: Oswald, sans-serif; font-weight: 600; font-size: 28px">CLIP B</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #C9A227">● PLAYING · 0:07</span>
</div>
<div style="background: #0A111D; border-radius: 3px; padding: 12px">
<svg viewBox="0 0 600 140" width="100%" height="140" role="img" aria-label="Spectrogram of clip B, half played">
<g stroke="#22314A" stroke-width="1"><path d="M0 35H600M0 70H600M0 105H600"></path></g>
<g fill="none" stroke="#C9A227" stroke-linecap="round" opacity="0.35" stroke-width="3" transform="translate(0,-38)"><path d="M8 70 C20 60 36 58 52 66 S80 84 98 70 S120 52 140 60 S170 80 190 74 M226 56 C248 40 262 44 280 58 S310 82 336 70"></path></g>
<g fill="none" stroke="#C9A227" stroke-linecap="round" stroke-width="5"><path d="M8 70 C20 60 36 58 52 66 S80 84 98 70 S120 52 140 60 S170 80 190 74 M226 56 C248 40 262 44 280 58 S310 82 336 70"></path></g>
<path d="M336 0V140" stroke="#F2EBDD" stroke-width="2"></path>
</svg>
</div>
<div style="height: 4px; background: #2A3A56"><div style="width: 56%; height: 4px; background: #C9A227"></div></div>
<div style="display: flex; gap: 12px; flex-wrap: wrap">
<button type="button" aria-label="Pause clip B" style="min-height: 48px; padding: 0 20px; border: 0; border-radius: 3px; background: #C9A227; color: #0E1726; font-family: Oswald, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 0.06em; display: flex; align-items: center; gap: 10px; cursor: pointer"><svg width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><path d="M1 1h3v14H1zM8 1h3v14H8z" fill="#0E1726"></path></svg>PAUSE</button>
<button type="button" style="flex-grow: 1; min-height: 48px; padding: 0 20px; border: 2px solid #C9A227; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 17px; letter-spacing: 0.06em; cursor: pointer">THIS ONE</button>
</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; justify-content: space-between">
<div style="display: flex; border: 1px solid #3A4C6B; border-radius: 3px; overflow: hidden" aria-label="Sound">
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 18px; border: 0; background: #F2EBDD; color: #0E1726; font-size: 15px; font-weight: 600; cursor: pointer">Trombone</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 0; border-left: 1px solid #3A4C6B; background: transparent; color: #C9D1DE; font-size: 15px; cursor: pointer">Trumpet</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 0; border-left: 1px solid #3A4C6B; background: transparent; color: #C9D1DE; font-size: 15px; cursor: pointer">Hum</button>
</div>
<p style="margin: 0; font-size: 16px; color: #A9B3C4">Play both clips, then pick one.</p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brass":{"editor":"color","default":"#C9A227","options":["#C9A227","#D98E3A","#B9C4D6"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { brass: this.props.brass ?? '#C9A227' };
}
}
</script>
</body>
</html>
