<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brass Anchors: classic round (Broadcast brass)</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0E1726}
a{color:#E3C25A}a:hover{color:#F2D77E}
</style>
</helmet>
<div style="width: 100%; min-height: 1000px; box-sizing: border-box; background: #0E1726; color: #F2EBDD; font-family: 'Source Sans 3', sans-serif; padding: 0 24px 64px">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #2A3A56; flex-wrap: wrap; gap: 12px">
<span style="font-family: Oswald, sans-serif; font-weight: 600; letter-spacing: 0.12em; font-size: 15px">BRASS ANCHORS</span>
<div style="display: flex; gap: 6px" aria-label="Round 2 of 5">
<span style="width: 40px; height: 6px; background: #C9A227"></span>
<span style="width: 40px; height: 6px; background: #F2EBDD"></span>
<span style="width: 40px; height: 6px; background: #2A3A56"></span>
<span style="width: 40px; height: 6px; background: #2A3A56"></span>
<span style="width: 40px; height: 6px; background: #2A3A56"></span>
</div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A9B3C4">SCORE 4</span>
</div>

<div style="display: flex; flex-direction: column; gap: 16px; background: #16233A; border-radius: 4px; padding: 24px">
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #A9B3C4">ROUND 2 OF 5 · GUESS THE CLIP</span>
<div style="display: flex; border: 1px solid #3A4C6B; border-radius: 3px; overflow: hidden" aria-label="Sound">
<button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 16px; border: 0; background: #F2EBDD; color: #0E1726; font-size: 15px; font-weight: 600; cursor: pointer">Trombone</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border: 0; border-left: 1px solid #3A4C6B; background: transparent; color: #C9D1DE; font-size: 15px; cursor: pointer">Trumpet</button>
<button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border: 0; border-left: 1px solid #3A4C6B; background: transparent; color: #C9D1DE; font-size: 15px; cursor: pointer">Hum</button>
</div>
</div>
<div style="background: #0A111D; border-radius: 3px; padding: 14px">
<svg viewBox="0 0 1000 160" width="100%" height="160" role="img" aria-label="Spectrogram of the clip">
<g stroke="#22314A" stroke-width="1"><path d="M0 40H1000M0 80H1000M0 120H1000"></path></g>
<g fill="none" stroke="#C9A227" stroke-linecap="round" opacity="0.35" stroke-width="3" transform="translate(0,-46)"><path d="M10 110 C40 80 70 76 96 90 S150 118 182 98 S236 70 270 104 M320 84 C350 60 392 64 424 92 S480 124 516 110 M566 72 C600 50 642 60 676 86 S738 128 800 132"></path></g>
<g fill="none" stroke="#C9A227" stroke-linecap="round" stroke-width="5"><path d="M10 110 C40 80 70 76 96 90 S150 118 182 98 S236 70 270 104 M320 84 C350 60 392 64 424 92 S480 124 516 110 M566 72 C600 50 642 60 676 86 S738 128 800 132"></path></g>
<path d="M800 0V160" stroke="#F2EBDD" stroke-width="2"></path>
</svg>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<button type="button" aria-label="Stop" style="width: 56px; height: 56px; flex-shrink: 0; border: 0; border-radius: 50%; background: #C9A227; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" fill="#0E1726"></rect></svg></button>
<div style="flex-grow: 1; height: 4px; background: #2A3A56"><div style="width: 80%; height: 4px; background: #C9A227"></div></div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A9B3C4">0:13 / 0:16</span>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px 40px">
<fieldset style="flex: 1 1 460px; margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="padding: 0 0 12px; font-family: Oswald, sans-serif; font-weight: 600; font-size: 22px; text-transform: uppercase">Decade <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 400; font-size: 13px; color: #A9B3C4; text-transform: none">2 pts, 1 if a decade off</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" aria-pressed="false" style="flex: 1 1 90px; min-height: 48px; border: 1px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 18px; cursor: pointer">1960s</button>
<button type="button" aria-pressed="true" style="flex: 1 1 90px; min-height: 48px; border: 0; border-radius: 3px; background: #C9A227; color: #0E1726; font-family: Oswald, sans-serif; font-weight: 600; font-size: 18px; cursor: pointer">1970s</button>
<button type="button" aria-pressed="false" style="flex: 1 1 90px; min-height: 48px; border: 1px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 18px; cursor: pointer">1980s</button>
<button type="button" aria-pressed="false" style="flex: 1 1 90px; min-height: 48px; border: 1px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 18px; cursor: pointer">1990s</button>
</div>
</fieldset>

<fieldset style="flex: 1 1 460px; margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="padding: 0 0 12px; font-family: Oswald, sans-serif; font-weight: 600; font-size: 22px; text-transform: uppercase">Country <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 400; font-size: 13px; color: #A9B3C4; text-transform: none">1 pt</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" aria-pressed="false" style="flex: 1 1 90px; min-height: 48px; border: 1px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 18px; cursor: pointer">US</button>
<button type="button" aria-pressed="false" style="flex: 1 1 90px; min-height: 48px; border: 1px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 18px; cursor: pointer">UK</button>
<button type="button" aria-pressed="false" style="flex: 1 1 90px; min-height: 48px; border: 1px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 18px; cursor: pointer">[Country]</button>
<button type="button" aria-pressed="false" style="flex: 1 1 90px; min-height: 48px; border: 1px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 18px; cursor: pointer">[Country]</button>
</div>
</fieldset>

<fieldset style="flex: 1 1 460px; margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="padding: 0 0 12px; font-family: Oswald, sans-serif; font-weight: 600; font-size: 22px; text-transform: uppercase">News or opinion? <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 400; font-size: 13px; color: #A9B3C4; text-transform: none">1 pt</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" aria-pressed="true" style="flex: 1 1 140px; min-height: 48px; border: 0; border-radius: 3px; background: #C9A227; color: #0E1726; font-family: Oswald, sans-serif; font-weight: 600; font-size: 18px; cursor: pointer">News</button>
<button type="button" aria-pressed="false" style="flex: 1 1 140px; min-height: 48px; border: 1px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 18px; cursor: pointer">Opinion</button>
</div>
</fieldset>

<fieldset style="flex: 1 1 460px; margin: 0; padding: 16px; border: 1px dashed #3A4C6B; border-radius: 4px; display: flex; flex-direction: column; gap: 12px">
<legend style="padding: 0 8px; font-family: Oswald, sans-serif; font-weight: 600; font-size: 22px; text-transform: uppercase; color: #C9A227">Station (bonus) <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 400; font-size: 13px; color: #A9B3C4; text-transform: none">1 pt</span></legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" aria-pressed="false" style="flex: 1 1 90px; min-height: 48px; border: 1px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 18px; cursor: pointer">[Station]</button>
<button type="button" aria-pressed="false" style="flex: 1 1 90px; min-height: 48px; border: 1px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 18px; cursor: pointer">[Station]</button>
<button type="button" aria-pressed="false" style="flex: 1 1 90px; min-height: 48px; border: 1px solid #3A4C6B; border-radius: 3px; background: transparent; color: #F2EBDD; font-family: Oswald, sans-serif; font-size: 18px; cursor: pointer">[Station]</button>
</div>
</fieldset>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; border-top: 1px solid #2A3A56; padding-top: 24px">
<p style="margin: 0; font-size: 16px; color: #A9B3C4">Two of three answered. Reveal whenever you're ready.</p>
<button type="button" style="min-height: 52px; padding: 0 40px; border: 0; border-radius: 3px; background: #C9A227; color: #0E1726; font-family: Oswald, sans-serif; font-weight: 600; font-size: 19px; letter-spacing: 0.08em; cursor: pointer">REVEAL</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brass":{"editor":"color","default":"#C9A227","options":["#C9A227","#D98E3A","#B9C4D6"]},"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
return { brass: this.props.brass ?? '#C9A227' };
}
}
</script>
</body>
</html>
