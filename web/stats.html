<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brass Anchors results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Source+Sans+3:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stats-page">
    <header class="topbar">
      <a class="wordmark home" href="./">
        <svg class="logo" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="14" cy="14" r="12"></circle><path d="M14 4v20M6 10c3 2 13 2 16 0M6 18c3-2 13-2 16 0"></path></svg>
        Brass Anchors
      </a>
      <div class="topbar-status"><span class="dot live"></span><span>The ratings</span></div>
    </header>
    <div class="hero stats-hero">
      <p class="eyebrow accent">Everyone's results so far</p>
    </div>

    <nav class="tabs" aria-label="Game mode">
      <a id="tab-match" href="?mode=match">Match the description</a>
      <a id="tab-classic" href="?mode=classic">Guess the clip</a>
    </nav>

    <p id="stats-status" class="muted">Loading…</p>

    <div id="stats-body" hidden>
      <div class="kpis" id="kpis"></div>

      <section>
        <h2>Final scores</h2>
        <p id="you-line"></p>
        <figure class="chart" id="score-chart"></figure>
        <details>
          <summary>Show as a table</summary>
          <table id="score-table" class="data"></table>
        </details>
      </section>

      <section id="match-sections">
        <h2>Accuracy by difficulty</h2>
        <table id="level-table" class="data"></table>
        <h3>Hard rounds, by what differed</h3>
        <table id="attribute-table" class="data"></table>
        <h2>Hardest comparisons</h2>
        <table id="hardest-pairs" class="data"></table>
        <h2>Easiest comparisons</h2>
        <table id="easiest-pairs" class="data"></table>
      </section>

      <section id="classic-sections">
        <h2>Exact answers by question</h2>
        <table id="question-table" class="data"></table>
        <h2>Hardest clips</h2>
        <table id="hardest-clips" class="data"></table>
        <h2>Easiest clips</h2>
        <table id="easiest-clips" class="data"></table>
      </section>

      <p class="muted" id="footnote"></p>
    </div>

    <p><a class="button brass" href="./">Play a game</a></p>
  </main>
  <script type="module" src="stats.js"></script>
</body>
</html>
